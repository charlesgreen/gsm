name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.25"
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.25"
    
    - name: Build binary
      run: go build -v ./cmd/server
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build multi-platform Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: gsm-emulator:test
        load: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Docker image for testing (amd64 only)
      run: docker build -t gsm-emulator:test .
    
    - name: Test Docker image
      run: |
        docker run -d --name gsm-test -p 8085:8085 gsm-emulator:test
        sleep 5
        curl -f http://localhost:8085/health || exit 1
        docker stop gsm-test
        docker rm gsm-test

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.25"
    
    - name: Start emulator
      run: |
        go run cmd/server/main.go &
        echo "Waiting for server to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8085/health 2>/dev/null; then
            echo "Server is ready"
            break
          fi
          echo "Waiting for server... ($i/30)"
          sleep 1
        done
    
    - name: Run integration tests
      run: go test -v ./tests/integration/...
    
    - name: Test with Google Cloud client
      run: |
        export SECRET_MANAGER_EMULATOR_HOST=localhost:8085
        go run pkg/client/example.go || echo "Example completed"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'
    
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
      continue-on-error: true

  # Every merge to main publishes a moving dev image. It never cuts a GitHub
  # release and never moves :latest — only a pushed semver tag does that.
  publish-dev:
    if: github.ref == 'refs/heads/main' && github.repository == 'charlesgreen/gsm'
    needs: [test, lint, build, integration-test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push multi-platform Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          charlesgreen/gsm:main
          charlesgreen/gsm:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Cutting a release is a deliberate act: push a semver tag (git tag v1.2.3).
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'charlesgreen/gsm'
    needs: [test, lint, build, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    - name: Resolve version from tag
      id: version
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        # A prerelease (v1.2.3-rc1) publishes its own image but must not move :latest.
        if [[ "${TAG}" == *-* ]]; then
          PRERELEASE=true
          IMAGES="charlesgreen/gsm:${VERSION}"$'\n'"charlesgreen/gsm:${GITHUB_SHA}"
        else
          PRERELEASE=false
          IMAGES="charlesgreen/gsm:${VERSION}"$'\n'"charlesgreen/gsm:latest"$'\n'"charlesgreen/gsm:${GITHUB_SHA}"
        fi
        {
          echo "tag=${TAG}"
          echo "prerelease=${PRERELEASE}"
          echo "images<<EOF"
          echo "${IMAGES}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Releasing ${TAG} (prerelease=${PRERELEASE})"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.25"

    - name: Build release binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -o bin/gsm-server-linux-amd64 ./cmd/server
        GOOS=linux GOARCH=arm64 go build -o bin/gsm-server-linux-arm64 ./cmd/server
        GOOS=darwin GOARCH=amd64 go build -o bin/gsm-server-darwin-amd64 ./cmd/server
        GOOS=darwin GOARCH=arm64 go build -o bin/gsm-server-darwin-arm64 ./cmd/server
        GOOS=windows GOARCH=amd64 go build -o bin/gsm-server-windows-amd64.exe ./cmd/server

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push multi-platform Docker image with release tags
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.version.outputs.images }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Publish GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}
      run: |
        FLAGS=()
        if [[ "${PRERELEASE}" == "true" ]]; then
          FLAGS+=(--prerelease)
        fi
        gh release create "${TAG}" \
          --title "${TAG}" \
          --generate-notes \
          "${FLAGS[@]}" \
          bin/gsm-server-*