# SimplyCubed Code configuration.
# https://github.com/simplycubed/code
#
# The gate is the command SimplyCubed Code must pass before it proposes a change.
# It runs the checks gsm's CI enforces that are runnable on one machine: go vet,
# golangci-lint (which now also enforces gofmt formatting), a build, and the full
# test suite (the integration tests are self-contained via httptest, so they run
# here too). Only the genuinely environmental parts of CI stay CI-only: the
# multi-version build matrix, the Docker image build, and the Google Cloud client
# smoke that needs a running emulator. Those run in gsm's own CI after a human
# merges.
labelPrefix: sc

gate: go vet ./... && golangci-lint run ./... && go build ./... && go test ./...
