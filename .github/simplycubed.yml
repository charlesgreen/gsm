# SimplyCubed Code configuration.
# https://github.com/simplycubed/code
#
# The gate is the command SimplyCubed Code must pass before it proposes a change.
# It mirrors the checks gsm's CI actually enforces (vet, golangci-lint, build,
# tests) as a subset that runs on one machine. The environmental checks in CI
# (multi-version build matrix, Docker image, integration tests that need a running
# emulator) are left to gsm's own CI, which runs after a human merges.
labelPrefix: sc

gate: go vet ./... && golangci-lint run ./... && go build ./... && go test ./tests/unit/...
